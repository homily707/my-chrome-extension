<!DOCTYPE html>
<html>
<head>
    <title>Grafana Time Jumper</title>
    <style>
        body {
            font-family: sans-serif;
            width: 300px;
            padding: 10px;
        }
        h1 {
            font-size: 16px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 95%;
            padding: 5px;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Grafana Time Jumper</h1>
    <div class="form-group">
        <label for="traceId">Trace ID:</label>
        <input type="text" id="traceId" placeholder="e.g., 20251104155404...">
    </div>
    <div class="form-group">
        <label for="timeRange">Range (+/-):</label>
        <input type="text" id="timeRange" value="5m">
    </div>
    <button id="jumpButton">Jump to Time</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
