<!DOCTYPE html>
<html>
<head>
    <title>Grafana Time Jumper</title>
    <style>
        body {
            font-family: sans-serif;
            width: 300px;
            padding: 10px;
        }
        h1 {
            font-size: 16px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 95%;
            padding: 5px;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            color: red;
            font-size: 12px;
        }
        .collapsible {
            background-color: #f1f1f1;
            border: none;
            cursor: pointer;
            padding: 8px;
            width: 100%;
            text-align: left;
            outline: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
        }
        .collapsible:hover {
            background-color: #ddd;
        }
        .collapsible:after {
            content: '\002B';
            color: black;
            font-weight: bold;
            float: right;
        }
        .collapsible.active:after {
            content: '\2212';
        }
        .content {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        .content.show {
            max-height: 200px;
            padding: 10px;
        }
        .checkbox-group {
            margin-top: 10px;
        }
        .checkbox-item {
            margin-bottom: 5px;
        }
        input[type="checkbox"] {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Grafana Helper</h1>
    <div class="form-group">
        <label for="traceId">Trace ID:</label>
        <input type="text" id="traceId" placeholder="e.g., 20251104155404...">
    </div>
    <div class="form-group">
        <label for="timeRange">Range (+/-):</label>
        <input type="text" id="timeRange" value="5m">
    </div>
    <button type="button" class="collapsible">APP: </button>
    <div class="content">
        <div class="form-group">
            <label for="releaseName">Release Name:</label>
            <input type="text" id="releaseName" placeholder="e.g., 202511101105294d9d065849564037">
        </div>
        <div class="checkbox-group">
            <div class="checkbox-item">
                <input type="checkbox" id="suffixMatch">
                <label for="suffixMatch">Suffix-regex: </label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="serverEntry">
                <label for="serverEntry">tracing: </label>
            </div>
        </div>
    </div>

    <button id="jumpButton">GO</button>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
